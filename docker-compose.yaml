# ================================================================
# Betpreneur Backend Docker Compose
# ================================================================
# Services: PostgreSQL, Backend, Celery Worker, Celery Beat
# ================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      TZ: Africa/Lagos
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      WEB_THREADS: ${WEB_THREADS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
    volumes:
      - media:/home/appuser/media
    networks:
      - betpreneur_network

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      TZ: Africa/Lagos
    command: celery -A config worker --loglevel=info --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
    volumes:
      - media:/home/appuser/media
    networks:
      - betpreneur_network

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      TZ: Africa/Lagos
    command: celery -A config beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    networks:
      - betpreneur_network

networks:
  betpreneur_network:
    driver: bridge

volumes:
  media:
    name: betpreneur_media