# ================================================================
# Betpreneur Backend Docker Compose
# ================================================================
# Services: PostgreSQL, Backend, Celery Worker, Celery Beat
# ================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      TZ: Africa/Lagos
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      WEB_THREADS: ${WEB_THREADS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
    volumes:
      - media:/home/appuser/media
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8000/api/health/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      TZ: Africa/Lagos
    command: celery -A config worker --loglevel=info --concurrency=1 --max-tasks-per-child=1 --prefetch-multiplier=1
    volumes:
      - media:/home/appuser/media

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      TZ: Africa/Lagos
    command: celery -A config beat --loglevel=info --schedule=/tmp/celerybeat-schedule

volumes:
  media:
    name: betpreneur_media
